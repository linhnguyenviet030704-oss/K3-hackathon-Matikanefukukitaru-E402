services:
  classifier:
    build:
      context: .
      dockerfile: skin-classifier/Dockerfile
    environment:
      SKIN_CLASSIFIER_DEVICE: cpu
      SKIN_CLASSIFIER_MODEL: resnet50
    volumes:
      - ./skin-classifier/weights:/app/weights:ro
    ports:
      - "8001:8001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CLASSIFIER_URL: http://classifier:8001/predict
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    env_file:
      - ./data/.env
    volumes:
      - ./data/chroma_db:/app/data/chroma_db:ro
      - ./backend/prompts:/app/backend/prompts:ro
    ports:
      - "8000:8000"
    depends_on:
      - classifier

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
